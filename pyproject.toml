[project]
name = "weekendpilot-demo"
version = "0.1.0"
description = "周末管家本地生活执行助手静态演示"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "langchain-openai>=0.3.0",
    "langgraph>=1.1.10",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change in a future version:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    "ignore:create_react_agent has been moved",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
