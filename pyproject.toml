[project]
name = "local-life-agent"
version = "1.0.0"
description = "基于 Google ADK、DeepSeek、MCP 与 Temporal 的美团意图到履约 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.136.1",
    "google-adk[db,mcp]>=2.0.0",
    "litellm>=1.83.12",
    "ortools>=9.15.6755",
    "pydantic-settings>=2.10.0",
    "temporalio>=1.24.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
]
