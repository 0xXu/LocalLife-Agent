services:
  nginx:
    image: nginx:alpine
    container_name: route-nginx
    ports:
      - "80:80"
    volumes:
      - ./routeplan:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      route-planner:
        condition: service_healthy
    restart: unless-stopped

  route-planner:
    build: .
    container_name: ai-route-planner
    expose:
      - "8081"
    environment:
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-liquidroute}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-liquidroute}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/route/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: liquidroute-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liquidroute}
      POSTGRES_USER: ${POSTGRES_USER:-liquidroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c max_connections=15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liquidroute} -d ${POSTGRES_DB:-liquidroute}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
