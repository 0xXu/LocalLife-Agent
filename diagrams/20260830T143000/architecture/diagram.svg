<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">好办 Local Life Agent 系统架构图</title>
  <desc id="description">从用户工作台到任务服务、智能决策、供给与履约的系统架构。</desc>
  <rect x="0" y="0" width="1600" height="1040" fill="#f5f8fc"/>
  <rect x="48" y="38" width="1504" height="112" rx="16" fill="#ffffff" stroke="#d7e2ef" stroke-width="2"/>
  <rect x="78" y="67" width="10" height="56" rx="5" fill="#0f9b8e"/>
  <text x="112" y="85" fill="#17324d" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700">系统架构设计</text>
  <text x="112" y="119" fill="#5f7185" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="19">面向本地生活任务的「意图理解 - 供给核验 - 计划求解 - 授权履约」闭环</text>
  <rect x="1265" y="68" width="238" height="46" rx="23" fill="#e6f6ed"/>
  <circle cx="1293" cy="91" r="8" fill="#31a36b"/>
  <text x="1312" y="97" fill="#2c7050" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">Intent to Fulfillment</text>

  <rect x="56" y="194" width="326" height="550" rx="18" fill="#eaf8f8" stroke="#97d7d5" stroke-width="2"/>
  <rect x="406" y="194" width="352" height="550" rx="18" fill="#edf4ff" stroke="#aecaf5" stroke-width="2"/>
  <rect x="782" y="194" width="352" height="550" rx="18" fill="#f1f8e8" stroke="#c1dba7" stroke-width="2"/>
  <rect x="1158" y="194" width="386" height="550" rx="18" fill="#fff4e5" stroke="#f0cf98" stroke-width="2"/>

  <text x="82" y="237" fill="#18364f" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">01 用户工作台</text>
  <text x="82" y="263" fill="#607789" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15">Next.js 16 + React 19</text>
  <rect x="82" y="290" width="274" height="92" rx="12" fill="#ffffff" stroke="#b4e0df" stroke-width="2"/>
  <circle cx="110" cy="321" r="15" fill="#ccefee"/><text x="110" y="327" text-anchor="middle" fill="#187f79" font-family="Arial" font-size="15" font-weight="700">1</text>
  <text x="139" y="320" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">目标输入与澄清</text>
  <text x="139" y="348" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">自然语言目标、限制与分支问题</text>
  <rect x="82" y="401" width="274" height="92" rx="12" fill="#ffffff" stroke="#b4e0df" stroke-width="2"/>
  <circle cx="110" cy="432" r="15" fill="#ccefee"/><text x="110" y="438" text-anchor="middle" fill="#187f79" font-family="Arial" font-size="15" font-weight="700">2</text>
  <text x="139" y="431" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">计划与局部编辑</text>
  <text x="139" y="459" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">候补方案、字段锁定、节点调整</text>
  <rect x="82" y="512" width="274" height="92" rx="12" fill="#ffffff" stroke="#b4e0df" stroke-width="2"/>
  <circle cx="110" cy="543" r="15" fill="#ccefee"/><text x="110" y="549" text-anchor="middle" fill="#187f79" font-family="Arial" font-size="15" font-weight="700">3</text>
  <text x="139" y="542" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">授权与现场履约</text>
  <text x="139" y="570" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">代办范围、交易确认、履约回执</text>
  <rect x="82" y="631" width="274" height="71" rx="12" fill="#d3f0ef"/>
  <text x="219" y="661" text-anchor="middle" fill="#286a6c" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">REST 操作 + SSE 推送</text>
  <text x="219" y="686" text-anchor="middle" fill="#56767a" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13">任务快照与后台进度同步</text>

  <text x="432" y="237" fill="#18364f" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">02 任务服务</text>
  <text x="432" y="263" fill="#607789" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15">FastAPI + TaskModule</text>
  <rect x="432" y="290" width="300" height="88" rx="12" fill="#ffffff" stroke="#c4d8f7" stroke-width="2"/>
  <text x="455" y="324" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">Task API</text>
  <text x="455" y="351" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">创建、消息、决策、事件流与授权</text>
  <rect x="432" y="398" width="300" height="88" rx="12" fill="#ffffff" stroke="#c4d8f7" stroke-width="2"/>
  <text x="455" y="432" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">TaskModule</text>
  <text x="455" y="459" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">revision、编辑、澄清与现场状态</text>
  <rect x="432" y="506" width="300" height="88" rx="12" fill="#ffffff" stroke="#c4d8f7" stroke-width="2"/>
  <text x="455" y="540" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">并发与事件控制</text>
  <text x="455" y="567" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">异步锁、版本检查、SSE progress</text>
  <rect x="432" y="614" width="300" height="88" rx="12" fill="#dce9ff"/>
  <text x="582" y="647" text-anchor="middle" fill="#2e5f9c" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">Application Container</text>
  <text x="582" y="675" text-anchor="middle" fill="#59728d" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13">统一装配任务、决策、供给与履约</text>

  <text x="808" y="237" fill="#18364f" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">03 智能决策</text>
  <text x="808" y="263" fill="#607789" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15">Google ADK + DeepSeek V4 Flash</text>
  <rect x="808" y="290" width="300" height="88" rx="12" fill="#ffffff" stroke="#d1e4b9" stroke-width="2"/>
  <text x="831" y="324" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">IntentGovernor</text>
  <text x="831" y="351" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">目标契约、意图框架与单问澄清</text>
  <rect x="808" y="398" width="300" height="88" rx="12" fill="#ffffff" stroke="#d1e4b9" stroke-width="2"/>
  <text x="831" y="432" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">查询编排器</text>
  <text x="831" y="459" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">按目录动态选择并行供给检索</text>
  <rect x="808" y="506" width="300" height="88" rx="12" fill="#ffffff" stroke="#d1e4b9" stroke-width="2"/>
  <text x="831" y="540" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">LifeGoalPlanner</text>
  <text x="831" y="567" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">Pareto 取舍与候选方案选择</text>
  <rect x="808" y="614" width="300" height="88" rx="12" fill="#e4f1d4"/>
  <text x="958" y="647" text-anchor="middle" fill="#527c36" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">强类型输出边界</text>
  <text x="958" y="675" text-anchor="middle" fill="#6a8059" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13">模型不生成价格、库存或交易动作</text>

  <text x="1184" y="237" fill="#18364f" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">04 供给与履约</text>
  <text x="1184" y="263" fill="#607789" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15">MCP + OR-Tools + Temporal</text>
  <rect x="1184" y="290" width="334" height="88" rx="12" fill="#ffffff" stroke="#f2d9b4" stroke-width="2"/>
  <text x="1207" y="324" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">Supply MCP</text>
  <text x="1207" y="351" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">能力目录、分域工具与资源</text>
  <rect x="1184" y="398" width="334" height="88" rx="12" fill="#ffffff" stroke="#f2d9b4" stroke-width="2"/>
  <text x="1207" y="432" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">Supply Twin + OR-Tools</text>
  <text x="1207" y="459" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">供给事实、可行组合与计划策略</text>
  <rect x="1184" y="506" width="334" height="88" rx="12" fill="#ffffff" stroke="#f2d9b4" stroke-width="2"/>
  <text x="1207" y="540" fill="#1d3a52" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">Temporal Workflow</text>
  <text x="1207" y="567" fill="#5c7283" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14">履约、观察、重试、停止与补偿</text>
  <rect x="1184" y="614" width="334" height="88" rx="12" fill="#ffebce"/>
  <text x="1351" y="647" text-anchor="middle" fill="#986620" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">两级授权门控</text>
  <text x="1351" y="675" text-anchor="middle" fill="#896d44" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13">Mandate 后，交易仍需二次确认</text>

  <line x1="382" y1="470" x2="406" y2="470" stroke="#3478d7" stroke-width="4"/><polygon points="406,470 394,463 394,477" fill="#3478d7"/>
  <line x1="758" y1="470" x2="782" y2="470" stroke="#3478d7" stroke-width="4"/><polygon points="782,470 770,463 770,477" fill="#3478d7"/>
  <line x1="1134" y1="470" x2="1158" y2="470" stroke="#5e9b68" stroke-width="4"/><polygon points="1158,470 1146,463 1146,477" fill="#5e9b68"/>

  <rect x="140" y="824" width="1320" height="144" rx="18" fill="#ffffff" stroke="#d5e0ec" stroke-width="2"/>
  <text x="174" y="867" fill="#18364f" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">持久状态与可观测性</text>
  <text x="174" y="895" fill="#607789" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15">聊天只是操作入口；任务事实、授权、供给状态与完成证据才是系统真相。</text>
  <rect x="174" y="917" width="198" height="30" rx="15" fill="#e4efff"/><text x="273" y="938" text-anchor="middle" fill="#466d98" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">任务与 revision</text>
  <rect x="390" y="917" width="198" height="30" rx="15" fill="#e3f4ec"/><text x="489" y="938" text-anchor="middle" fill="#4e7d64" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">偏好与 ADK Session</text>
  <rect x="606" y="917" width="198" height="30" rx="15" fill="#fff0d8"/><text x="705" y="938" text-anchor="middle" fill="#936c36" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">供给与生命周期</text>
  <rect x="822" y="917" width="198" height="30" rx="15" fill="#eee9fa"/><text x="921" y="938" text-anchor="middle" fill="#69598f" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">回执与完成证据</text>
  <rect x="1038" y="917" width="388" height="30" rx="15" fill="#e8f2f4"/><text x="1232" y="938" text-anchor="middle" fill="#426d74" font-family="Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">PostgreSQL Document Store</text>
  <line x1="582" y1="744" x2="582" y2="824" stroke="#3478d7" stroke-width="3"/><polygon points="582,824 575,812 589,812" fill="#3478d7"/>
  <line x1="958" y1="744" x2="958" y2="824" stroke="#5e9b68" stroke-width="3"/><polygon points="958,824 951,812 965,812" fill="#5e9b68"/>
  <line x1="1351" y1="744" x2="1351" y2="824" stroke="#d28a2c" stroke-width="3"/><polygon points="1351,824 1344,812 1358,812" fill="#d28a2c"/>
